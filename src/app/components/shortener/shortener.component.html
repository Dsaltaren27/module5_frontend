<div class="shortener-page-container">
  <div class="shortener-card">
    
    <div class="shortener-header">
      <h1 class="shortener-title">
        Cortador Serverless de URLs
      </h1>
      <p class="shortener-subtitle">
        Genera enlaces rápidos, seguros y monitoreados en AWS Cloud.
      </p>
    </div>

    <div class="shortener-form-space">
      <div>
        <label class="shortener-label">
          Pega tu URL larga aquí
        </label>
        <div class="shortener-input-group">
          <input 
            type="url" 
            [(ngModel)]="longUrl"
            placeholder="https://ejemplo.com/un-enlace-muy-largo-y-complejo"
            class="shortener-input"
            [disabled]="isLoading"
          />
          <button 
            (click)="generateShortUrl()"
            [disabled]="isLoading || !longUrl.trim()"
            class="shortener-btn-submit"
          >
            @if (isLoading) {
              <div class="shortener-spinner"></div>
              <span>Procesando...</span>
            } @else {
              <span>Acortar Link</span>
            }
          </button>
        </div>
      </div>
    </div>

    @if (errorMessage) {
      <div class="shortener-error-banner">
        ⚠️ {{ errorMessage }}
      </div>
    }

    @if (shortenedUrl) {
      <div class="shortener-result-box">
        <label class="shortener-result-label">
          ¡Tu enlace corto está listo!
        </label>
        <div class="shortener-result-row">
          <span class="shortener-url-display">
            {{ shortenedUrl }}
          </span>
          <button 
            (click)="copyToClipboard()"
            [class.bg-emerald]="isCopied"
            [class.bg-slate]="!isCopied"
            class="shortener-btn-copy"
          >
            {{ isCopied ? '¡Copiado!' : 'Copiar' }}
          </button>
        </div>
        <p class="shortener-result-footer">
          Este link redirigirá de manera segura a través de la pantalla de verificación del Módulo 5.
        </p>
      </div>
    }

  </div>
</div>
